name: Sync Rules

on:
  push:
    branches: [ main ]
    paths:
      - 'loon/rule/**'
      - 'clash/yaml/**'
      - 'singbox/config/**'
      - 'routes.yaml'
      - 'sync_rules.py'
      - 'sync_config.py'
      - '.github/workflows/sync-rules.yml'
  pull_request:
    paths:
      - 'loon/rule/**'
      - 'clash/yaml/**'
      - 'singbox/config/**'
      - 'routes.yaml'
      - 'sync_rules.py'
      - 'sync_config.py'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      # PR 只校验，不写回：产物与源不一致时直接失败，提示本地重新生成
      - name: Check rules are in sync
        if: github.event_name == 'pull_request'
        run: python3 sync_rules.py --check

      # 主配置：clash 与 sing-box 是否都与 routes.yaml 一致
      - name: Check main configs are in sync
        if: github.event_name == 'pull_request'
        run: python3 sync_config.py --check

      - name: Sync rules to all formats
        if: github.event_name != 'pull_request'
        run: python3 sync_rules.py

      # 由 routes.yaml 重新生成 clash 两份主配置 + sing-box 配置
      - name: Regenerate main configs
        if: github.event_name != 'pull_request'
        run: python3 sync_config.py

      - name: Validate clash configs
        if: github.event_name != 'pull_request'
        run: |
          curl -sL -o mihomo.gz \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.2/mihomo-linux-amd64-v1.19.2.gz
          gunzip mihomo.gz && chmod +x mihomo
          mkdir -p .mihomo-test
          # smart.yaml 需要 smart 内核，官方内核无法校验，故只验通用版
          cp clash/yaml/urltest.yaml .mihomo-test/config.yaml
          ./mihomo -t -d .mihomo-test -f .mihomo-test/config.yaml
          rm -rf .mihomo-test mihomo

      - name: Validate sing-box config
        if: github.event_name != 'pull_request'
        run: |
          V=1.13.19
          curl -sL -o sb.tar.gz \
            https://github.com/SagerNet/sing-box/releases/download/v${V}/sing-box-${V}-linux-amd64.tar.gz
          tar xzf sb.tar.gz
          ./sing-box-${V}-linux-amd64/sing-box check -c singbox/config/config.json
          rm -rf sb.tar.gz sing-box-${V}-linux-amd64

      - name: Generate README.md for rule folders
        if: github.event_name != 'pull_request'
        run: |
          # 不含 clash/yaml 与 singbox/config —— 两者放的是说明文档而非规则，
          # 早期 workflow 曾把 clash/yaml/README.md 覆盖成 URL 列表。
          for subdir in clash/rule loon/rule Egern/rule quanx/rule singbox/rule Surge/rule \
                        Egern/module Surge/config Surge/module Surge/boxjs \
                        loon/plugin quanx/rewrite quanx/task; do
            [ -d "$subdir" ] || continue
            readme="$subdir/README.md"
            : > "$readme"
            for file in "$subdir"/*; do
              if [ -f "$file" ] && [ "$(basename "$file")" != "README.md" ]; then
                echo "https://raw.githubusercontent.com/Lucasss1916/AgentSoftware/main/$file" >> "$readme"
              fi
            done
          done

      - name: Commit changes
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash/ loon/ Egern/ Surge/ quanx/ singbox/ routes.yaml
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: 自动同步规则至各客户端格式"
            git push origin main
          fi
