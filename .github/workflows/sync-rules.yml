# 唯一的云端自动同步工作流。
# 规则源位于 loon/rule(主)与 routes.yaml(主配置分流)。
# 任何人在云端(GitHub Web / 手机)改动源文件并推送后,此工作流自动:
#   生成全部客户端产物 -> 用官方内核校验 -> 机器人把产物提交回 main。
# 本地完全不需要运行任何脚本,也无需人工同步。
name: Auto Sync Rules

"on":
  push:
    branches: [ main ]
    paths:
      - 'loon/rule/**'
      - 'clash/yaml/**'
      - 'singbox/config/**'
      - 'anywhere/rule/**'
      - 'routes.yaml'
      - 'sync_rules.py'
      - 'sync_config.py'
      - 'gen_readme.py'
      - 'tests/**'
      - '.github/workflows/sync-rules.yml'
  pull_request:
    paths:
      - 'loon/rule/**'
      - 'clash/yaml/**'
      - 'singbox/config/**'
      - 'anywhere/rule/**'
      - 'routes.yaml'
      - 'sync_rules.py'
      - 'sync_config.py'
      - 'gen_readme.py'
      - 'tests/**'
      - '.github/workflows/sync-rules.yml'
  workflow_dispatch:

permissions:
  contents: write

# 连续推送时新任务取代旧任务,防止两个 job 抢 push
concurrency:
  group: sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    # 机器人自己提交的产物改动不再次触发,避免无限循环
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Test Anywhere rule generation
        run: python3 -m unittest discover -s tests -v

      # ---- 生成:云端编辑源文件后,所有客户端产物在这里自动铺开 ----
      - name: Generate rules for all clients
        run: python3 sync_rules.py

      - name: Regenerate folder READMEs
        run: python3 gen_readme.py

      - name: Regenerate main configs (routes.yaml -> clash + sing-box)
        run: python3 sync_config.py

      # ---- 校验:官方内核把关,不合格就不提交 ----
      - name: Validate clash configs
        run: |
          curl -sL -o mihomo.gz \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.2/mihomo-linux-amd64-v1.19.2.gz
          gunzip mihomo.gz && chmod +x mihomo
          mkdir -p .mihomo-test
          # smart.yaml 需要 smart 内核,官方内核无法校验,故只验通用版
          cp clash/yaml/urltest.yaml .mihomo-test/config.yaml
          ./mihomo -t -d .mihomo-test -f .mihomo-test/config.yaml
          rm -rf .mihomo-test mihomo

      - name: Validate sing-box config
        run: |
          V=1.13.19
          curl -sL -o sb.tar.gz \
            https://github.com/SagerNet/sing-box/releases/download/v${V}/sing-box-${V}-linux-amd64.tar.gz
          tar xzf sb.tar.gz
          ./sing-box-${V}-linux-amd64/sing-box check -c singbox/config/config.json
          rm -rf sb.tar.gz sing-box-${V}-linux-amd64

      # ---- 提交:仅 push 到 main 时把产物交回;PR 只校验不提交 ----
      - name: Commit generated products back to main
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "产物与源已一致,无需提交"
            exit 0
          fi
          git commit -m "🤖 auto: 根据源文件重新生成各客户端产物"
          # 云端可能有人同时改了源文件,先 rebase 远端再推,避免提交被拒
          git pull --rebase origin main
          git push