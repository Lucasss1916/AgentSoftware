name: Sync Rules

on:
  push:
    branches: [ main ]
    paths:
      - 'loon/rule/**'
      - 'clash/yaml/**'
      - 'singbox/config/**'
      - 'routes.yaml'
      - 'sync_rules.py'
      - 'sync_config.py'
      - 'gen_readme.py'
      - '.github/workflows/sync-rules.yml'
  pull_request:
    paths:
      - 'loon/rule/**'
      - 'clash/yaml/**'
      - 'singbox/config/**'
      - 'routes.yaml'
      - 'sync_rules.py'
      - 'sync_config.py'
      - 'gen_readme.py'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      # CI 只校验、永不写回。
      # 早先 push 时会跑生成器再 commit 回 main —— 于是每次 push 远端都自动多一个
      # 机器人提交，本地必然落后，下次 push 必被拒。改为纯校验后 main 只由人推进。
      # 忘了本地生成就在这里失败，照提示跑一遍再推。
      - name: Check rules are in sync
        run: python3 sync_rules.py --check

      # 主配置：clash 与 sing-box 是否都与 routes.yaml 一致
      - name: Check main configs are in sync
        run: python3 sync_config.py --check

      - name: Check folder READMEs are in sync
        run: python3 gen_readme.py --check

      - name: Validate clash configs
        run: |
          curl -sL -o mihomo.gz \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.2/mihomo-linux-amd64-v1.19.2.gz
          gunzip mihomo.gz && chmod +x mihomo
          mkdir -p .mihomo-test
          # smart.yaml 需要 smart 内核，官方内核无法校验，故只验通用版
          cp clash/yaml/urltest.yaml .mihomo-test/config.yaml
          ./mihomo -t -d .mihomo-test -f .mihomo-test/config.yaml
          rm -rf .mihomo-test mihomo

      - name: Validate sing-box config
        run: |
          V=1.13.19
          curl -sL -o sb.tar.gz \
            https://github.com/SagerNet/sing-box/releases/download/v${V}/sing-box-${V}-linux-amd64.tar.gz
          tar xzf sb.tar.gz
          ./sing-box-${V}-linux-amd64/sing-box check -c singbox/config/config.json
          rm -rf sb.tar.gz sing-box-${V}-linux-amd64
