experimental: {}
hosts: {}
profile:
  store-selected: true
  store-fake-ip: true
ntp: {}
sniffer: {}
tun:
  enable: true
  stack: mixed
  device: Mihomo
  endpoint-independent-nat: true
  auto-route: true
  auto-detect-interface: true
  auto-redirect: false
  strict-route: false
  dns-hijack:
  - any:53
  route-exclude-address: []
  mtu: 1350
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: false
  prefer-h3: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  use-hosts: false
  use-system-hosts: false
  respect-rules: true
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://223.5.5.5/dns-query
  - https://doh.pub/dns-query
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query
  direct-nameserver:
  - https://223.5.5.5/dns-query
  - https://doh.pub/dns-query
  fallback: []
  nameserver-policy:
    ? rule-set:ChatGPT / Domain,GitHub / Domain,Telegram / Domain,Google / Domain,Youtube
      / Domain,Twitter / Domain,Facebook / Domain,Netflix / Domain,TikTok / Domain,Disney
      / Domain,Spotify / Domain,Reddit / Domain
    : - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query
    rule-set:China / Domain,Apple-CN / Domain:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
    rule-set:Private / Domain:
    - system
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - +.market.xiaomi.com
  - +.weixin.qq.com
  - +.qpic.cn
  - +.qq.com
  - localhost.ptlogin2.qq.com
  - time.*.com
  - time.*.gov
  - ntp.*.com
  - +.pool.ntp.org
  - '*.stun.*'
  - '*.stun.*.*'
  - stun.l.google.com
  - stun1.l.google.com
  - stun2.l.google.com
  - +.srv.nintendo.net
  - +.stun.playstation.net
  - xbox.*.microsoft.com
  - +.xboxlive.com
  - msftconnecttest.com
  - msftncsi.com
  - +.msftconnecttest.com
  - +.msftncsi.com
  - captive.apple.com
