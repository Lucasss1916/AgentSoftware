  icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Google.png



- name: Spotify
  type: select
  proxies: *all-proxies

  icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Spotify.png



- name: Apple
  type: select
  proxies: *all-proxies

