# ==========================
# 兜底
# ==========================


- name: 漏网之鱼

  type: fallback

  icon: https://www.clashverge.dev/assets/icons/fish.svg

  proxies:

    - 香港-智选
    - 新加坡-智选
    - 日本-智选
    - 台湾-智选
    - 韩国-智选
    - 美国-智选
    - 英国-智选
    - 所有-手选
    - 其他
    - DIRECT



# ==========================
# 地区智能选择
# ==========================


- name: 香港-智选

  type: smart

  include-all: true

  policy-priority: Mitce:0.7

  uselightgbm: true

  collectdata: true

  interval: 300


  filter: >
    (?=.*(广港|香港|HK|Hong Kong|🇭🇰|HongKong)).*$



- name: 台湾-智选

  type: smart

  include-all: true

  policy-priority: Mitce:0.7

  uselightgbm: true

  collectdata: true

  interval: 300


  filter: >
    (?=.*(广台|台湾|台灣|TW|Tai Wan|🇹🇼|Taiwan)).*$



- name: 日本-智选

  type: smart

  include-all: true

  policy-priority: Mitce:0.7

  uselightgbm: true

  collectdata: true

  interval: 300


  filter: >
    (?=.*(广日|日本|JP|东京|大阪|🇯🇵|Japan)).*$



- name: 新加坡-智选

  type: smart

  include-all: true

  policy-priority: Mitce:0.7

  uselightgbm: true

  collectdata: true

  interval: 300


  filter: >
    (?=.*(广新|新加坡|SG|Singapore|🇸🇬)).*$



- name: 韩国-智选

  type: smart

  include-all: true

  uselightgbm: true

  collectdata: true

  interval: 300


  filter: >
    (?=.*(广韩|韩国|KR|Korea|🇰🇷)).*$



- name: 美国-智选

  type: smart

  include-all: true

  uselightgbm: true

  collectdata: true

  interval: 300


  filter: >
    (?=.*(广美|美国|US|United States|🇺🇸)).*$



- name: 英国-智选

  type: smart

  include-all: true

  uselightgbm: true

  collectdata: true

  interval: 300


  filter: >
    (?=.*(英国|UK|United Kingdom|🇬🇧)).*$



- name: 其他

  type: smart

  include-all: true

  uselightgbm: true

  collectdata: true

  interval: 300


  filter: >
    ^((?!(香港|台湾|日本|新加坡|韩国|美国|英国|HK|TW|JP|SG|KR|US|UK)).)*$
