

experimental: {}

geodata-mode: true

geo-auto-update: true
geo-update-interval: 72

geox-url:
  geosite: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
  geoip: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat


hosts: {}


profile:
  store-selected: true
  store-fake-ip: true


# ==========================
# TUN
# ==========================

tun:
  enable: true

  stack: gvisor

  device: utun

  endpoint-independent-nat: true

  # 旁路网关模式保留关闭
  auto-route: false

  auto-detect-interface: false

  auto-redirect: false

  strict-route: false



# ==========================
# DNS
# ==========================

dns:

  enable: true

  listen: 0.0.0.0:7874

  ipv6: false


  enhanced-mode: fake-ip


  fake-ip-range: 198.18.0.1/16


  # 避免游戏 NAT / STUN 被 fake-ip
  fake-ip-filter:

    - "*.lan"
    - "*.local"

    # 时间同步
    - time.*.com
    - ntp.*.com

    # 小米
    - "*.market.xiaomi.com"

    # 微信
    - "*.weixin.qq.com"
    - "*.qpic.cn"
    - "*.qq.com"
    - localhost.ptlogin2.qq.com


    # STUN
    - "*.stun.*"
    - "*.stun.*.*"
    - stun.l.google.com
    - stun1.l.google.com
    - stun2.l.google.com


    # 游戏 NAT
    - "*.srv.nintendo.net"
    - "*.n.n.srv.nintendo.net"


    # 网络检测
    - msftconnecttest.com
    - msftncsi.com



  use-hosts: false

  use-system-hosts: false


  # 非常重要
  # 让 DNS 遵循 rules
  respect-rules: true



  # 国内 DNS
  nameserver:

    - https://223.5.5.5/dns-query

    - https://doh.pub/dns-query



  # 代理节点域名解析
  proxy-server-nameserver:

    - https://223.5.5.5/dns-query



  # DIRECT 使用
  direct-nameserver:

    - https://223.5.5.5/dns-query

    - https://doh.pub/dns-query



  # 国外 fallback
  fallback:

    - https://dns.google/dns-query

    - https://cloudflare-dns.com/dns-query



  fallback-filter:

    geoip: true

    geoip-code: CN


    ipcidr:

      - 240.0.0.0/4

      - 0.0.0.0/32



  # ==========================
  # geosite DNS 分流
  # ==========================

  nameserver-policy:


    # 国内域名
    "geosite:cn":

      - https://223.5.5.5/dns-query


    # 私网
    "geosite:private":

      - system


    # Google
    "geosite:google":

      - https://dns.google/dns-query


    # Telegram
    "geosite:telegram":

      - https://dns.google/dns-query


    # GFW
    "geosite:gfw":

      - https://dns.google/dns-query


    # OpenAI
    "geosite:openai":

      - https://dns.google/dns-query
# ==========================
# Proxy Groups
# ==========================


proxy-groups:


