# ============================================================
#  Mihomo 配置 — Smart 内核版（type: smart，需 vernesong/mihomo smart 内核）
#  由 gen.py + common_head.yaml + common_rules.yaml 生成
#  修改请编辑上述三个源文件后重跑： python3 gen.py
# ============================================================

# ============================================================
#  机场节点订阅（按需取消注释并填入订阅地址）
# ============================================================
# proxy-providers:
#   Mitce:
#     url: "机场订阅地址"
#     type: http
#     interval: 86400
#     health-check: {enable: true, url: https://www.gstatic.com/generate_204, interval: 300}
#     proxy: 所有-手选
#
#   69yun:
#     url: "机场订阅地址"
