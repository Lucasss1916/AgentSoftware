    type: smart
    uselightgbm: true
    collectdata: true
    policy-priority: "Mitce:0.7"
    include-all: true
    interval: 300
    filter: "(?!.*(?i:10x))(?=.*(广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan)).*$"
