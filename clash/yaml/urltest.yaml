# ========================
# 主要端口设置
# ========================
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895

allow-lan: true
mode: rule
log-level: info

external-controller: 0.0.0.0:9090
# external-ui: ui
# external-ui-name: zashboard
# external-ui-url: https://gh-proxy.com/github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip
secret: "anv4SIzOSEWGMXcIoT-hGT-5LigNk9v0"

# ========================
# DNS 设置
# ========================
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  nameserver:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
  fake-ip-filter:
    - +.lan
    - +.local
    - time.*.com
    - ntp.*.com
    - +.market.xiaomi.com
    - +.weixin.qq.com
    - +.qpic.cn
    - +.qq.com
    - localhost.ptlogin2.qq.com
  use-hosts: false
  use-system-hosts: false
  respect-rules: true
  default-nameserver:
    - tls://223.5.5.5
    - 119.29.29.29
    - 223.5.5.5
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
ipv6: true

# ========================
# TUN 模块
# ========================
tun:
  enable: true
  stack: system
  device: Mihomo
  endpoint-independent-nat: true
  auto-route: true
  auto-detect-interface: true
  auto-redirect: false
  strict-route: false
  dns-hijack:
    - any:53
  route-exclude-address: []
  mtu: 1350

profile:
  store-selected: true
  store-fake-ip: true
# ========================
# 嗅探模块
# ========================
sniffer:
  enable: true
  parse-pure-ip: true
  force-dns-mapping: true
  override-destination: true
  sniff:
    HTTP:
      ports:
        - 80
        - 443
      override-destination: true
    TLS:
      ports:
        - 443
    QUIC:
      ports:
        - "443"
        - "80"
  skip-domain:
    - +.push.apple.com
  force-domain: []
  skip-src-address: []
# ========================
# 策略组定义
# ========================
default: &default
  type: select
  proxies:
    - 所有-手选
    - 香港-延时优选
    - 台湾-延时优选
    - 日本-延时优选
    - 新加坡-延时优选
    - 韩国-延时优选
    - 美国-延时优选
    - 英国-延时优选
    - 其他
    - DIRECT
    - REJECT

proxy-groups:

  # 业务分流组
  - {name: AIGC,icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/OpenAI.png, <<: *default}
  - {name: GitHub,icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/github.png,  <<: *default}
  - {name: Telegram, icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Telegram.png,<<: *default}
  - {name: Video, icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Emby.png,<<: *default}
  - {name: 国外媒体,icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Google.png, <<: *default}
  - {name: Spotify,icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Spotify.png, <<: *default}
  - {name: Apple,icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Apple.png, <<: *default}
  - {name: Microsoft,icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Microsoft.png, <<: *default}
  - {name: Steam,icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Steam.png, <<: *default}
  - {name: Game,icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/GAME.png, <<: *default}
  - {name: Test, icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Urltest.png,<<: *default}
  - {name: Block,icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Adblock.png, <<: *default}

  - name: 所有-手选
    type: select
    include-all: true
    icon: https://www.clashverge.dev/assets/icons/adjust.svg
    

  - name: 漏网之鱼
    type: fallback
    icon: https://www.clashverge.dev/assets/icons/fish.svg
    proxies:
    - 香港-延时优选
    - 新加坡-延时优选
    - 日本-延时优选
    - 台湾-延时优选
    - 韩国-延时优选
    - 美国-延时优选
    - 英国-延时优选
    - 所有-手选
    - 其他
    - DIRECT

  # 香港组
  - name: 香港-延时优选
    type: url-test
    url: 'https://www.gstatic.com/generate_204'
    interval: 300
    include-all: true
    tolerance: 30
    lazy: true
    filter: "(?=.*(广港|香港|HK|Hong Kong|🇭🇰|HongKong)).*$"
    icon: https://fastly.jsdelivr.net/gh/Semporia/Hand-Painted-icon@master/Rounded_Rectangle/Hong_Kong.png

  # 台湾组
  - name: 台湾-延时优选
    type: url-test
    url: 'https://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 30
    include-all: true
    lazy: true
    filter: "(?=.*(广台|台湾|台灣|TW|Tai Wan|🇹🇼|TaiWan|Taiwan)).*$"
    icon: https://fastly.jsdelivr.net/gh/Semporia/Hand-Painted-icon@master/Rounded_Rectangle/Taiwan.png

  # 日本组
  - name: 日本-延时优选
    type: url-test
    url: 'https://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 30
    include-all: true
    lazy: true
    filter: "(?=.*(广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan)).*$"
    icon: https://fastly.jsdelivr.net/gh/Semporia/Hand-Painted-icon@master/Rounded_Rectangle/Japan.png


  # 新加坡组
  - name: 新加坡-延时优选
    type: url-test
    url: 'https://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 30
    include-all: true
    lazy: true
    filter: "(?=.*(广新|新加坡|SG|坡|狮城|🇸🇬|Singapore)).*$"
    icon: https://fastly.jsdelivr.net/gh/Semporia/Hand-Painted-icon@master/Rounded_Rectangle/Singapore.png

  # 韩国组
  - name: 韩国-延时优选
    type: url-test
    url: 'https://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 30
    include-all: true
    filter: "(?=.*(广韩|韩国|韓國|KR|首尔|春川|🇰🇷|Korea)).*$"
    icon: https://fastly.jsdelivr.net/gh/Semporia/Hand-Painted-icon@master/Rounded_Rectangle/South_Korea.png
    lazy: true

  # 美国组
  - name: 美国-延时优选
    type: url-test
    url: 'https://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 30
    include-all: true
    filter: "(?=.*(广美|美|US|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|拉斯|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States)).*$"
    icon: https://fastly.jsdelivr.net/gh/Semporia/Hand-Painted-icon@master/Rounded_Rectangle/United_States.png
    lazy: true

  # 英国组
  - name: 英国-延时优选
    type: url-test
    url: 'https://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 30
    include-all: true
    filter: "(?=.*(英国|英|伦敦|UK|United Kingdom|🇬🇧|London)).*$"
    icon: https://fastly.jsdelivr.net/gh/Semporia/Hand-Painted-icon@master/Rounded_Rectangle/England.png
    lazy: true

  # 其他组
  - name: 其他
    type: url-test
    url: 'https://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 30
    include-all: true
    filter: "^((?!(直连|拒绝|广港|香港|HK|Hong Kong|🇭🇰|HongKong|广台|台湾|台灣|TW|Tai Wan|🇹🇼|TaiWan|Taiwan|广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan|广新|新加坡|SG|坡|狮城|🇸🇬|Singapore|广韩|韩国|韓國|KR|首尔|春川|🇰🇷|Korea|广美|美|US|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|拉斯|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States|英国|UK|United Kingdom|伦敦|英|London|🇬🇧)).)*$"
    lazy: true
