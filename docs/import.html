<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>一键导入 · AgentSoftware</title>
<!--
  GitHub 的 markdown 会把非 http(s) 链接过滤掉，所以 surge:/// 、anywhere:// 这类
  自定义协议没法在仓库里做成可点的链接。这个页面就是那一层跳板：

      import.html?s=<整条 scheme 经 encodeURIComponent 后的结果>

  由 gen_readme.py 生成链接，页面读出 s 再 location.replace 过去。

  scheme 必须白名单校验 —— 否则任何人都能拼出 ?s=javascript:... 把这里
  当成开放重定向用。
-->
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 2rem 1.25rem;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #fff; color: #1f2328;
  }
  main { width: 100%; max-width: 34rem; }
  h1 { font-size: 1.25rem; margin: 0 0 .75rem; }
  p { margin: .75rem 0; }
  pre {
    margin: .75rem 0; padding: .75rem; border-radius: 8px;
    background: #f6f8fa; border: 1px solid #d1d9e0;
    font-size: .8125rem; white-space: pre-wrap; word-break: break-all;
  }
  .btn, button {
    display: inline-block; padding: .5rem 1rem; border-radius: 8px;
    border: 1px solid #d1d9e0; background: #f6f8fa; color: inherit;
    font: inherit; cursor: pointer; text-decoration: none;
  }
  .btn { background: #1f883d; border-color: #1f883d; color: #fff; font-weight: 600; }
  .muted { color: #59636e; font-size: .875rem; }
  .err { color: #d1242f; }
  [hidden] { display: none !important; }
  @media (prefers-color-scheme: dark) {
    body { background: #0d1117; color: #e6edf3; }
    pre, button { background: #151b23; border-color: #3d444d; }
    .muted { color: #9198a1; }
    .err { color: #ff7b72; }
  }
</style>
</head>
<body>
<main>
  <h1>一键导入</h1>
  <p id="hint">正在唤起客户端…</p>
  <p id="actions" hidden>
    <a id="go" class="btn" href="#">打开客户端</a>
    <button id="copy" type="button">复制链接</button>
  </p>
  <pre id="raw" hidden></pre>
  <p id="tip" class="muted" hidden>
    没有反应说明本机没装对应客户端，或浏览器拦下了自定义协议。
    可以复制上面的链接，用「快捷指令 → 打开 URL」打开，或在客户端自带的导入入口里粘贴。
  </p>
  <p class="muted">链接由 <a href="https://github.com/Lucasss1916/AgentSoftware">AgentSoftware</a> 的 <code>gen_readme.py</code> 生成。</p>
</main>
<script>
(function () {
  "use strict";

  // 仓库里实际会生成的协议头，仅此几个。
  var ALLOWED = [
    "loon:", "egern:", "surge:", "surgeconfig:", "quantumult-x:",
    "anywhere:", "mihomo:", "clash:", "sing-box:", "stash:", "shadowrocket:"
  ];

  var hint = document.getElementById("hint");
  var actions = document.getElementById("actions");
  var raw = document.getElementById("raw");
  var tip = document.getElementById("tip");

  function fail(message) {
    hint.textContent = message;
    hint.className = "err";
  }

  // ?s= 是主路径（整条 scheme 百分号编码）；#... 作为手写链接时的兜底。
  // 兜底这条逐字取用、不做 decode —— Surge 等客户端要求内层 url= 保持百分号
  // 编码，解一层就会把 %3A%2F%2F 还原成 :// 从而破坏它自己的解析。
  var params = new URLSearchParams(location.search);
  var target = params.get("s") || location.hash.slice(1);

  if (!target) {
    fail("链接里没带要导入的地址（缺少 ?s= 参数）。");
    return;
  }

  var scheme = target.slice(0, target.indexOf(":") + 1).toLowerCase();
  if (ALLOWED.indexOf(scheme) === -1) {
    fail("不支持的协议头：" + scheme + "，本页只跳转已知的代理客户端。");
    return;
  }

  raw.textContent = target;
  raw.hidden = false;
  tip.hidden = false;
  actions.hidden = false;

  var go = document.getElementById("go");
  go.href = target;
  hint.textContent = "若客户端没有自动弹出，点下面的按钮。";

  document.getElementById("copy").addEventListener("click", function () {
    var done = this;
    navigator.clipboard.writeText(target).then(function () {
      done.textContent = "已复制";
    }, function () {
      done.textContent = "复制失败，请手动选中";
    });
  });

  // 自动唤起。部分浏览器要求用户手势，拦下来也无妨，上面的按钮兜着。
  location.replace(target);
})();
</script>
</body>
</html>
