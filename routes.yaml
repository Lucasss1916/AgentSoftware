  - RULE-SET,Disney / Domain,国外媒体
  - RULE-SET,HBO / Domain,国外媒体
  - RULE-SET,Crunchyroll / Domain,国外媒体

  # ---- 游戏（Steam CDN 走直连，避免下载跑代理流量）----
